[workspace]
# The readest forks under packages/ are pulled in through [patch.crates-io]
# below, not listed as members: the Linux CEF build (see
# apps/readest-app/src-tauri/.cargo/cef.toml) patches tauri and the plugins to
# upstream git instead, and a member fork would still sit in the graph and
# clash on `links` with the git copy.
members = [
  "apps/readest-app/src-tauri"
]
exclude = [
  "packages/qcms",
  # The tauri fork is its own cargo workspace and its crates use
  # `workspace = true` inheritance. Keep it out of this workspace so those
  # resolve against packages/tauri/Cargo.toml; it still reaches the build
  # through [patch.crates-io] below.
  "packages/tauri"
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
log = "0.4"
tauri = { version = "2", default-features = false }
tauri-build = "2"
tauri-plugin = "2"
tauri-utils = "2"
schemars = "0.8"
serde_json = "1"
thiserror = "2"
glob = "0.3"
zbus = "5.9"
dunce = "1"
url = "2"
tar = "0.4.45"
nix = "0.20.2"
glib = "0.20.0"

[workspace.package]
authors = ["Bilingify LLC"]
homepage = "https://readest.com"
license = "AGPL-3.0"
repository = "https://github.com/readest/readest"
categories = []
edition = "2021"
rust-version = "1.90"

[patch.crates-io]
tauri = { path = "packages/tauri/crates/tauri" }
# Xcode 26.x (Swift 6.2) broke upstream swift-rs's per-swiftc target
# override; the vendored copy cross-compiles via `--triple`/`--sdk` instead.
# Upstream 1.0.8 (2026-08) only takes that path on Xcode 27, so the vendored
# copy stays. It is labelled 1.0.8 to satisfy tauri's `swift-rs = "1.0.8"`;
# without that cargo cannot unify swift-rs and silently drops the tauri patch
# above in favour of crates.io tauri. See packages/swift-rs.
swift-rs = { path = "packages/swift-rs" }

[profile.release]
# The Android library is 95% of the APK, and one codegen unit is the one knob
# that shrinks the code itself: on aarch64 it cuts .text 29.7MB -> 24.4MB and
# the unwind/exception tables 6.2MB -> 4.1MB. It costs ~1.5min on a clean
# build and ~0.5GB of peak memory (measured aarch64-linux-android, M-series).
#
# LTO is deliberately NOT enabled: fat, thin and off all produce the same
# .text once codegen-units is 1, so it would buy nothing but link time.
codegen-units = 1
