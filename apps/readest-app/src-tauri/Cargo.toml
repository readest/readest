[package]
name = "Readest"
version = "0.2.2"
description = "Your online library"
authors = ["Bilingify LLC"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "readestlib"
crate-type = ["staticlib", "cdylib", "lib"]

[features]
default = ["wry"]
# WebView2 / WKWebView runtime, and on Linux the WebKitGTK one, which is left
# only for the webdriver test harness (scripts/test-tauri.sh) — every Linux
# build that ships runs on CEF and turns this off
# (`--no-default-features --features cef`, see scripts/tauri.mjs).
wry = ["tauri/wry", "tauri/x11", "tauri/dbus"]
# Chromium Embedded Framework runtime, the Linux runtime (`pnpm tauri`). On
# feat/cef the runtime is its own crate, which tauri-build and the tauri CLI
# detect to build and bundle for CEF. It is only real when .cargo/cef.toml
# takes it from feat/cef; every other build resolves it to the empty stub in
# packages/tauri-runtime-cef-stub (see the root Cargo.toml).
cef = ["dep:tauri-runtime-cef", "dep:zbus", "tauri-plugin-native-bridge/cef"]
# Internal feature to suppress warnings from old objc crate
cargo-clippy = []
# Enable WebDriver plugin for E2E testing (use with `tauri build --debug --features webdriver`)
webdriver = ["tauri-plugin-webdriver"]
devtools = ["tauri/devtools", "tauri-runtime-cef?/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
semver = "1"
base64 = "0.22"
psl = "2" # Validate response cookie domains before updating the browser session.
minisign-verify = "0.2"
log = "0.4"
thiserror = "2"
walkdir = "2"
tokio = { version = "1", features = ["fs", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures-util = "0.3"
futures = "0.3.31"
read-progress-stream = "1.0.0"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
] }
tauri = { version = "2", default-features = false, features = [
  "protocol-asset",
  "compression",
  "common-controls-v6",
  "dynamic-acl",
] }
tauri-build = "2"
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
# `unsafe-headers` lets callers pass fetch-spec "forbidden" headers (Origin,
# Referer, Cookie, ...) instead of having the plugin silently drop them. Needed
# so the OAuth token exchange can opt out of the webview Origin the plugin would
# otherwise stamp on it, which Microsoft rejects with AADSTS90023.
tauri-plugin-http = { version = "2", features = [
  "dangerous-settings",
  "unsafe-headers",
] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-oauth = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-sign-in-with-apple = "1.0.2"
tauri-plugin-haptics = "2"
tauri-plugin-biometric = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-native-bridge = { path = "./plugins/tauri-plugin-native-bridge" }
tauri-plugin-native-tts = { path = "./plugins/tauri-plugin-native-tts" }
tauri-plugin-webview-upgrade = { path = "./plugins/tauri-plugin-webview-upgrade" }
tauri-plugin-websocket = "2"
tauri-plugin-sharekit = "0.3"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-device-info = "1.0.1"
tauri-plugin-turso = { path = "./plugins/tauri-plugin-turso" }
tauri-plugin-webdriver = { version = "0.2", optional = true }

# LocalSend protocol v2.2 (discovery + HTTPS transfer). Upstream's own
# protocol core, pinned by rev; `discovery` pulls `http`+`crypto`+`multicast`,
# WebRTC/v3 stays off.
#
# Sourced from our fork, which only adds `update = none` to upstream's flutter
# submodule. Cargo updates every submodule of a git dependency, so upstream
# pulls the whole Flutter SDK (552 MB checked out) and blows past MAX_PATH on
# Windows. The fork's `readest` branch tracks the same upstream rev
# (ff2995c9523c5fae407f7d444d0986b2c6ae568e); rebase it when bumping.
localsend = { git = "https://github.com/readest/localsend", rev = "1609ca7cd5689e10cc4703e7ce178513e5d95b11", default-features = false, features = ["discovery"] }
uuid = { version = "1", features = ["v4"] }
pem = "4"
anyhow = "1"
bytes = "1"
# Loopback media proxy (media_proxy.rs). All three already ship inside reqwest;
# `server` just turns on hyper's serving half.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-stream = "0.1"
if-addrs = "0.15"

# Native EPUB import path (Q1): zip + quick-xml + md5.
# Used by `epub_parser::parse_epub_metadata` (partialMD5 + downscaled
# cover) and `parse_epub_full` (OPF/nav/ncx prefetch + entry-size
# table) to do the mechanical zip work without ferrying multi-MB blobs
# across the JS<->Rust IPC boundary. Pure-Rust crates so they ship to
# every Tauri target (desktop, iOS, Android) without extra system deps.
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
md-5 = "0.10"
# Used by `epub_parser::read_zip_entry` as a fallback when an OPF/manifest
# href is percent-encoded (e.g. spaces as %20, CJK paths) but the zip stores
# the raw decoded bytes — or vice versa. Already in our transitive dep graph
# (reqwest pulls it), so adding it explicitly costs nothing.
percent-encoding = "2"

# Cover thumbnail generation (Q2). We decode the cover image extracted
# from the EPUB and, when its long edge exceeds the library-grid size,
# re-encode a smaller JPEG so the on-disk `cover.png` is suitable for
# webview rendering (~30-60 KB instead of multi-MB). Default features
# are disabled to keep the binary lean — we only need decoders for the
# formats EPUBs actually use (jpeg/png/gif) plus the JPEG encoder.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Image sizes from header bytes alone, so comic pages are measured without
# decoding them (comic_parser.rs).
imagesize = { version = "0.14", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "jxl", "heif"] }

# Native MOBI/AZW/AZW3 import path. Mirrors the EPUB fast-path: parse
# PalmDB + MobiHeader + EXTH in Rust to extract title/author/publisher/
# description/isbn/asin/subjects/language and the cover image, then
# return them to JS so the importer skips the foliate-js MOBI parser
# (which has to inflate the whole record stream up-front on the iOS
# WebView). Pure-Rust crate, ships to every Tauri target.
mobi = "0.8"

# Import-only PDF metadata. `pdf` resolves the trailer/catalog/XMP from an
# mmap-backed source, so importing does not allocate or transfer the complete
# PDF. Page-one cover rendering stays in Android's native PdfRenderer.
pdf = { version = "0.10", default-features = false }
memmap2 = "0.9"
flate2 = "1"

# Sentry removed for fork builds — no crash reporting.

[target."cfg(target_os = \"macos\")".dependencies]
rand = "0.8"
cocoa = "0.25"
objc = "0.2.7"
objc-foundation = "0.1.1"
objc_id = "0.1.1"
block = "0.1.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-authentication-services = "0.3"
objc2-foundation = { version = "0.3", features = ["NSError", "NSArray"] }

# Linux uses the XDG desktop portal for dialogs instead of rfd's gtk3 backend.
# rfd's gtk3 chooser pumps GTK on a private thread, and that thread iterates
# the default GLib main context that CEF's browser process also runs its X11
# event source on, so mouse events get dispatched off Chromium's UI thread
# and mojo aborts the app (SIGTRAP) as soon as the dialog closes. The portal
# runs out of process over D-Bus; other platforms keep the native chooser.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
# The CEF runtime, enabled by the `cef` feature above.
tauri-runtime-cef = { version = "0.1", optional = true }
# Hands a relaunch to the running instance before CEF starts, see
# src/linux_single_instance.rs.
zbus = { version = "5", optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-dialog = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-cli = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
discord-rich-presence = "1.0.0"

[target.'cfg(windows)'.dependencies]
# Registry reads for the default-browser lookup in the cold-browser
# OAuth-redirect fallback (see src/spawn_fresh_browser.rs) and the OS build
# check behind the Windows 10 shadow workaround (see src/lib.rs).
winreg = "0.52"
# Forces a nonclient-area recalculation on the hidden main window before its
# saved geometry is restored (see restore_main_window_state in src/lib.rs).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
