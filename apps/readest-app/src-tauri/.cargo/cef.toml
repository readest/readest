# Cargo config for the Linux CEF build. Cargo does not load it on its own:
# `pnpm tauri:cef` (scripts/tauri-cef.mjs) hands it to cargo with `--config`,
# so every other build keeps resolving tauri from the readest fork pinned in
# the root Cargo.toml. Linux needs nothing from that fork, so the CEF build
# takes the whole tauri family and the plugins straight from upstream's
# `feat/cef` branches; a config-level patch wins over the manifest one.
#
# The family is patched together because two versions of tauri-utils or
# tauri-build in one graph break `generate_context!`. The plugin patches are
# picked up only while Cargo.lock keeps each plugin at the version published
# on `feat/cef`: cargo prefers a newer crates.io release over a lower-versioned
# patch, so bumping a plugin past that branch silently drops back to the
# crates.io build, and the four scoped plugins (fs, http, opener, shell) then
# fail to compile against `feat/cef`'s schemars-1 `tauri-plugin`.
[patch.crates-io]
tauri = { git = "https://github.com/readest/tauri", branch = "feat/cef" }
tauri-build = { git = "https://github.com/readest/tauri", branch = "feat/cef" }
tauri-codegen = { git = "https://github.com/readest/tauri", branch = "feat/cef" }
tauri-macros = { git = "https://github.com/readest/tauri", branch = "feat/cef" }
tauri-plugin = { git = "https://github.com/readest/tauri", branch = "feat/cef" }
tauri-runtime = { git = "https://github.com/readest/tauri", branch = "feat/cef" }
tauri-utils = { git = "https://github.com/readest/tauri", branch = "feat/cef" }

tauri-plugin-biometric = { git = "https://github.com/readest/tauri-plugins-workspace", branch = "feat/cef" }
tauri-plugin-cli = { git = "https://github.com/readest/tauri-plugins-workspace", branch = "feat/cef" }
tauri-plugin-clipboard-manager = { git = "https://github.com/readest/tauri-plugins-workspace", branch = "feat/cef" }
tauri-plugin-deep-link = { git = "https://github.com/readest/tauri-plugins-workspace", branch = "feat/cef" }
tauri-plugin-dialog = { git = "https://github.com/readest/tauri-plugins-workspace", branch = "feat/cef" }
tauri-plugin-fs = { git = "https://github.com/readest/tauri-plugins-workspace", branch = "feat/cef" }
tauri-plugin-haptics = { git = "https://github.com/readest/tauri-plugins-workspace", branch = "feat/cef" }
tauri-plugin-http = { git = "https://github.com/readest/tauri-plugins-workspace", branch = "feat/cef" }
tauri-plugin-log = { git = "https://github.com/readest/tauri-plugins-workspace", branch = "feat/cef" }
tauri-plugin-opener = { git = "https://github.com/readest/tauri-plugins-workspace", branch = "feat/cef" }
tauri-plugin-os = { git = "https://github.com/readest/tauri-plugins-workspace", branch = "feat/cef" }
tauri-plugin-persisted-scope = { git = "https://github.com/readest/tauri-plugins-workspace", branch = "feat/cef" }
