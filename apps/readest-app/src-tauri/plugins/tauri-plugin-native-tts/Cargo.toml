[package]
name = "tauri-plugin-native-tts"
version = "0.1.0"
authors = [ "You" ]
description = ""
edition = "2021"
rust-version = "1.88"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-native-tts"

[dependencies]
tauri = { version = "2" }
serde = "1.0"
thiserror = "2"
schemars = "0.8"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
schemars = "0.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
cpal = "=0.16.0"
soundtouch = { version = "=0.5.4", features = ["bundled"] }
symphonia = { version = "=0.6.1", default-features = false, features = ["aac", "alac", "isomp4", "mp3", "flac", "vorbis", "ogg", "wav", "pcm"] }
miniz_oxide = "=0.8.9"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDictionary", "NSString", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSImage"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-media-player = { version = "0.3", features = ["MPNowPlayingInfoCenter", "MPMediaItem", "block2", "objc2-app-kit", "objc2-core-foundation"] }
block2 = "0.6"
