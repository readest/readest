[package]
name = "readest-lite"
version = "0.1.0"
edition = "2024"
publish = false
description = "Readest Lite: readest-app's React UI on tauri-runtime-blitz (no browser engine)"

[dependencies]
tauri = { path = "../vendor/tauri/crates/tauri", default-features = false, features = ["compression", "dynamic-acl", "protocol-asset"] }
tauri-runtime-blitz = { path = "../crates/tauri-runtime-blitz", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"

[build-dependencies]
tauri-build = { path = "../vendor/tauri/crates/tauri-build" }

[features]
default = ["system-fonts"]
# Fonts from fontconfig when BLITZ_FONTS is unset. scripts/build-kindle.sh builds without it.
system-fonts = ["tauri-runtime-blitz/system-fonts"]
# A desktop window to use the UI (BLITZ_TAURI_WINDOW=1): `cargo run --features window`.
window = ["tauri-runtime-blitz/window"]
