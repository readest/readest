[package]
name = "readest-lite"
version = "0.1.0"
edition = "2024"
publish = false
description = "Readest Lite: readest-app's React UI on tauri-runtime-blitz (no browser engine)"

[dependencies]
tauri = { path = "../vendor/tauri/crates/tauri", default-features = false, features = ["compression", "dynamic-acl", "protocol-asset"] }
tauri-runtime-blitz = { path = "../crates/tauri-runtime-blitz", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-persisted-scope = "2"
# `download_file`: covers and books from Readest Cloud. The client tauri-runtime-blitz's fetch uses.
ureq = "3.4"
# The database Readest's reading statistics, library search, dictionaries and TTS cache use.
tauri-plugin-turso = { path = "../../readest-app/src-tauri/plugins/tauri-plugin-turso" }

# A static musl build (the Kindle) gets mimalloc for every allocation, Rust's and C's: musl's malloc
# is slow, and QuickJS, Stylo and the text layout allocate on every frame.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "=0.1.52", default-features = false, features = ["override", "v2"] }

[build-dependencies]
tauri-build = { path = "../vendor/tauri/crates/tauri-build" }

[features]
default = ["system-fonts"]
# Fonts from fontconfig when BLITZ_FONTS is unset. scripts/build-kindle.sh builds without it.
system-fonts = ["tauri-runtime-blitz/system-fonts"]
# A desktop window to use the UI (BLITZ_TAURI_WINDOW=1): `cargo run --features window`.
window = ["tauri-runtime-blitz/window"]
