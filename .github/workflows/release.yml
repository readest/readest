name: Release Gratis Readest

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gratis-stable-release
  cancel-in-progress: false

jobs:
  get-release:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_ready: ${{ steps.prepare.outputs.release_ready }}
      release_id: ${{ steps.prepare.outputs.release_id }}
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      release_title: ${{ steps.prepare.outputs.release_title }}
      release_url: ${{ steps.prepare.outputs.release_url }}
      release_note: ${{ steps.prepare.outputs.release_note }}
      release_version: ${{ steps.prepare.outputs.release_version }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24

      - name: resolve upstream release and prepare draft
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          upstream_release=$(gh api repos/readest/readest/releases/latest)
          upstream_tag=$(jq -r '.tag_name' <<<"$upstream_release")
          [[ "$upstream_tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::unsupported upstream tag: $upstream_tag"; exit 1; }
          version=${BASH_REMATCH[1]}
          current_version=$(node -p "require('./apps/readest-app/package.json').version")
          if [ "$current_version" != "$version" ]; then
            echo "No release: main version $current_version does not match latest upstream release $version."
            echo 'release_ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch https://github.com/readest/readest.git "refs/tags/$upstream_tag"
          upstream_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
          source_sha=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$upstream_sha" "$source_sha"; then
            echo "No release: upstream release commit $upstream_sha is not merged into main."
            echo 'release_ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_tag="gratis-$upstream_tag"
          releases=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")
          existing=$(jq -c --arg tag "$release_tag" '[.[] | select(.tag_name == $tag)] | first // empty' <<<"$releases")
          if [ -n "$existing" ] && [ "$(jq -r '.draft' <<<"$existing")" = false ]; then
            echo "Release $release_tag is already published."
            echo 'release_ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$existing" ]; then
            source_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/$release_tag" --jq .sha)
            [ "$(jq -r '.draft' <<<"$existing")" = true ] || { echo '::error::existing release is not a draft'; exit 1; }
            [ "$(git show "$source_sha:apps/readest-app/package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')" = "$version" ] \
              || { echo '::error::draft tag version does not match its source commit'; exit 1; }
            git fetch https://github.com/readest/readest.git "refs/tags/$upstream_tag"
            upstream_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
            git merge-base --is-ancestor "$upstream_sha" "$source_sha"
            release_id=$(jq -r '.id' <<<"$existing")
            release_url=$(jq -r '.html_url' <<<"$existing")
            release_title=$(jq -r '.name' <<<"$existing")
            release_note=$(jq -r '.body // ""' <<<"$existing")
          else
            tag_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$release_tag" --jq '.object.sha' 2>/dev/null || true)
            if [ -n "$tag_ref" ]; then
              tagged_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/$release_tag" --jq .sha)
              [ "$tagged_sha" = "$source_sha" ] || { echo '::error::release tag already points at another commit'; exit 1; }
            fi
            notes=$(node -e 'const x=require("./apps/readest-app/release-notes.json").releases[process.argv[1]]||{}; console.log((x.notes||[]).map((n,i)=>`${i+1}. ${n}`).join("\n"))' "$version")
            release_title="Gratis Readest $version"
            release_note=$(printf 'Follows Readest %s at %s.\n\n%s' "$upstream_tag" "$upstream_sha" "$notes")
            release_url=$(gh release create "$release_tag" --draft --title "$release_title" --notes "$release_note" --target "$source_sha")
            release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$release_tag" --jq .id)
            jq -n --arg version "$version" --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{version:$version,pub_date:$pub_date,notes:"Gratis Readest release",platforms:{}}' > latest.json
            gh release upload "$release_tag" latest.json --clobber
          fi

          echo "release_ready=true" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_title=$release_title" >> "$GITHUB_OUTPUT"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"
          delimiter="RELEASE_NOTE_$(openssl rand -hex 8)"
          {
            echo "release_note<<$delimiter"
            printf '%s\n' "$release_note"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          echo "release_version=$version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  build-koreader-plugin:
    needs: get-release
    if: needs.get-release.outputs.release_ready == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.get-release.outputs.source_sha }}
          persist-credentials: false

      - name: Build LocalSend helper binaries for KOReader (static musl armv7 + arm64)
        run: |
          rustup target add armv7-unknown-linux-musleabi
          rustup target add aarch64-unknown-linux-musl
          pip3 install --break-system-packages --require-hashes -r .github/requirements/zigbuild.txt
          node apps/readest.koplugin/scripts/build-localsend-bins.mjs --only armv7
          node apps/readest.koplugin/scripts/build-localsend-bins.mjs --only arm64

      - name: create KOReader plugin zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${{ needs.get-release.outputs.release_version }}
          plugin_zip="Readest-${version}-1.koplugin.zip"
          meta_file="apps/readest.koplugin/_meta.lua"
          perl -i -pe "s/^}/    version = \"${version}\",\n}/" "${meta_file}"

          # Exclude dev-only artifacts from the published plugin zip:
          #   scripts/  — i18n + build helpers
          #   docs/     — design notes
          #   spec/     — busted test suite
          #   .busted   — busted runner config
          #   native/   — Rust source for the LocalSend helper binary (built
          #               static-musl binaries ship from bin/ instead)
          # Mirror these in apps/readest.koplugin/scripts/build-koplugin.mjs
          # for local builds.
          cd apps
          zip -r ../${plugin_zip} readest.koplugin \
            -x 'readest.koplugin/scripts/*' \
               'readest.koplugin/docs/*' \
               'readest.koplugin/spec/*' \
               'readest.koplugin/.busted' \
               'readest.koplugin/native/*'
          cd ..

          echo "Uploading ${plugin_zip} to GitHub release"
          .github/scripts/retry.sh gh release upload ${{ needs.get-release.outputs.release_tag }} ${plugin_zip} --clobber

  build-calibre-plugin:
    needs: get-release
    if: needs.get-release.outputs.release_ready == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.get-release.outputs.source_sha }}
          persist-credentials: false

      - name: create calibre plugin zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${{ needs.get-release.outputs.release_version }}

          # Stamp PLUGIN_VERSION in __init__.py with the release version
          # (from apps/readest-app/package.json, mirroring the koplugin's
          # _meta.lua stamp above); the committed value is a dev placeholder.
          version_tuple=$(echo "${version}" | awk -F. '{printf "(%d, %d, %d)", $1, $2, $3}')
          perl -i -pe "s/^PLUGIN_VERSION = \(\d+, \d+, \d+\)/PLUGIN_VERSION = ${version_tuple}/" \
            apps/readest-calibre-plugin/__init__.py

          make -C apps/readest-calibre-plugin zip
          plugin_zip="apps/readest-calibre-plugin/dist/Readest-${version}.calibre-plugin.zip"

          echo "Uploading ${plugin_zip} to GitHub release"
          .github/scripts/retry.sh gh release upload ${{ needs.get-release.outputs.release_tag }} ${plugin_zip} --clobber

  build-crosspoint-plugin:
    needs: get-release
    if: needs.get-release.outputs.release_ready == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.get-release.outputs.source_sha }}
          persist-credentials: false

      - name: create CrossPoint plugin zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${{ needs.get-release.outputs.release_version }}
          plugin_zip="Readest-${version}.crosspoint-plugin.zip"
          cd apps/readest-crosspoint-plugin

          # Stamp the release version (from apps/readest-app/package.json, like
          # the plugins above) into manifest.json, whose committed value is a dev
          # placeholder. CrossPoint's plugin store and the plugin's own update
          # check compare it to spot updates. The reader's plugin list shows only
          # device.json's title and description, so the description leads with it.
          jq --arg version "${version}" '.version = $version' readest/manifest.json > manifest.tmp
          mv manifest.tmp readest/manifest.json
          jq --arg version "${version}" '.description = "Version \($version). \(.description)"' \
            readest/device.json > device.tmp
          mv device.tmp readest/device.json

          # The zip holds the readest/ folder that goes on the SD card as
          # /.crosspoint/plugins/readest/, with the install guide inside it.
          cp README.md readest/README.md
          zip -r "../../${plugin_zip}" readest
          cd ../..

          echo "Uploading ${plugin_zip} to GitHub release"
          .github/scripts/retry.sh gh release upload ${{ needs.get-release.outputs.release_tag }} ${plugin_zip} --clobber

  build-browser-extension:
    needs: get-release
    if: needs.get-release.outputs.release_ready == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.get-release.outputs.source_sha }}
          persist-credentials: false

      - name: setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: create and upload Send to Readest extension zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm --filter @readest/send-to-readest-extension zip

          extension_version=$(node -p "require('./apps/readest-app/extensions/send-to-readest/manifest.json').version")
          extension_zip="apps/readest-app/extensions/send-to-readest/send-to-readest-${extension_version}.zip"

          echo "Uploading ${extension_zip} to GitHub release"
          .github/scripts/retry.sh gh release upload "${{ needs.get-release.outputs.release_tag }}" "${extension_zip}" --clobber

  build-tauri:
    needs: get-release
    if: needs.get-release.outputs.release_ready == 'true'
    permissions:
      contents: write
      # Required by actions/attest-build-provenance: id-token mints the Sigstore
      # OIDC identity, attestations writes the provenance to the repo's store.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        config:
          # One APK per ABI group; `arch` names the APK and its updater key
          # (android-<arch>, see src/helpers/updater.ts::getAndroidPlatformKey).
          - os: ubuntu-latest
            release: android
            arch: arm64
            rust_target: aarch64-linux-android
            android_args: '-t aarch64'
          - os: ubuntu-latest
            release: android
            arch: armv7
            rust_target: armv7-linux-androideabi
            android_args: '-t armv7'
          - os: ubuntu-latest
            release: android
            arch: legacy
            rust_target: i686-linux-android,x86_64-linux-android
            android_args: '-t i686 -t x86_64'
          - os: ubuntu-22.04
            release: linux
            arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            release: linux
            arch: aarch64
            rust_target: aarch64-unknown-linux-gnu
          - os: windows-latest
            release: windows
            arch: x86_64
            rust_target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc --bundles nsis'
          - os: windows-latest
            release: windows
            arch: aarch64
            rust_target: aarch64-pc-windows-msvc
            args: '--target aarch64-pc-windows-msvc --bundles nsis'

    runs-on: ${{ matrix.config.os }}
    # Leave room for setup and signing after the long Android builds.
    timeout-minutes: ${{ matrix.config.release == 'android' && 150 || 90 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.get-release.outputs.source_sha }}
          persist-credentials: false

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: setup Java (for Android build only)
        if: matrix.config.release == 'android'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: setup Android SDK (for Android build only)
        if: matrix.config.release == 'android'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # The legacy `tools` package (part of the action's default) no longer
          # exists in the SDK repository and makes sdkmanager fail.
          packages: 'platform-tools'

      - name: install NDK (for Android build only)
        if: matrix.config.release == 'android'
        run: sdkmanager "ndk;28.2.13676358"

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.config.rust_target }}

      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          key: ${{ matrix.config.os }}-${{ matrix.config.release }}-${{ matrix.config.arch }}-cargo

      # The npm cli-cef bundles the AppImage with a broken quick-sharun fork
      # and cannot be pointed elsewhere. Build the CLI from readest/tauri
      # instead: its sharun_cef.rs pins pkgforge's deployment-array quoting
      # fix (Anylinux-AppImages#855) and runs the tooling with bash and
      # streamed output. Rev-pinned; the marker skips the rebuild while
      # rust-cache keeps ~/.cargo/bin. scripts/tauri.mjs runs `cargo tauri`
      # when TAURI_CEF_CARGO=1.
      - name: install the CEF tauri CLI from readest/tauri (linux only)
        if: matrix.config.release == 'linux'
        run: |
          set -euo pipefail
          rev=6beeb209b5514f597a26f48b7a5b9fe4c59b5f12
          marker="$HOME/.cargo/bin/.cargo-tauri-rev"
          if [ -x "$HOME/.cargo/bin/cargo-tauri" ] && [ "$(cat "$marker" 2>/dev/null)" = "$rev" ]; then
            echo "cargo-tauri at $rev already installed"
            exit 0
          fi
          cargo install tauri-cli --git https://github.com/readest/tauri --rev "$rev" --locked --force
          echo "$rev" > "$marker"

      - name: install dependencies (ubuntu only)
        if: contains(matrix.config.os, 'ubuntu') && matrix.config.release != 'android' && matrix.config.arch != 'armhf'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libclang-dev g++ libfontconfig-dev libgtk-3-dev libwebkit2gtk-4.1 libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev gir1.2-javascriptcoregtk-4.1 gir1.2-webkit2-4.1 libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: install dependencies (ubuntu only - armhf specific)
        if: contains(matrix.config.os, 'ubuntu') && matrix.config.arch == 'armhf'
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev:armhf libclang-dev libfontconfig-dev:armhf libgtk-3-dev:armhf libwebkit2gtk-4.1-dev:armhf libappindicator3-dev:armhf librsvg2-dev:armhf gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          echo 'PKG_CONFIG_ALLOW_CROSS=1' >> $GITHUB_ENV
          echo 'PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig' >> $GITHUB_ENV
          echo 'PKG_CONFIG_SYSROOT_DIR=/usr/arm-linux-gnueabihf' >> $GITHUB_ENV
          echo 'CARGO_TARGET_ARM_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc' >> $GITHUB_ENV
          echo 'CARGO_TARGET_ARM_UNKNOWN_LINUX_GNUEABIHF_RUSTFLAGS=--cfg=io_uring_skip_arch_check' >> $GITHUB_ENV

      # Chromium dlopens NSS, libpulse and libspeechd by soname; whatever the
      # bundle lacks comes from the host at run time and fails against the
      # bundled glibc on any newer distro (NSS: FATAL crypto/nss_util.cc).
      # quick-sharun's DEPLOY_CHROMIUM deploys NSS and, via DEPLOY_PIPEWIRE,
      # pulse — with the pinned pkgforge script the CLI above uses. Three gaps
      # remain, passed as appimage.files under /usr/lib, which the bundler
      # hands to quick-sharun as arguments: Debian keeps the NSS modules in
      # <triple>/nss/ where the Arch-layout globs miss them, and nothing
      # deploys libspeechd. winit dlopens libxkbcommon-x11 by soname when it
      # opens its X11 event loop (the CEF runtime forces X11 even on Wayland),
      # and quick-sharun's Chromium rule would deploy it, but the runner image
      # has no copy to deploy; without it every launch panics before the first
      # log line (#6144). The npm cli-cef could do none of this: its
      # quick-sharun fork drops the `eval` that rebuilds the deploy array
      # (FabianLars/Anylinux-AppImages@3e280d1b), so every DEPLOY_* extra is
      # silently skipped.
      - name: stage CEF AppImage runtime libraries (linux only)
        if: matrix.config.release == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y libnss3 libpulse0 libspeechd2 libxkbcommon-x11-0
          nss_dir=$(dirname "$(ls /usr/lib/*-linux-gnu/nss/libsoftokn3.so)")
          lib_dir=${nss_dir%/nss}
          sudo cp -f --remove-destination "$nss_dir"/*.so "$lib_dir/"
          # +=: tauri.conf.json already ships the AppRun hook entry.
          conf=apps/readest-app/src-tauri/tauri.conf.json
          jq --arg d "$lib_dir" '.bundle.linux.appimage.files += {
              "/usr/lib/libsoftokn3.so": ($d + "/libsoftokn3.so"),
              "/usr/lib/libfreeblpriv3.so": ($d + "/libfreeblpriv3.so"),
              "/usr/lib/libnssckbi.so": ($d + "/libnssckbi.so"),
              "/usr/lib/libspeechd.so.2": ($d + "/libspeechd.so.2"),
              "/usr/lib/libxkbcommon-x11.so.0": ($d + "/libxkbcommon-x11.so.0")
            }' "$conf" > "$conf.tmp" && mv "$conf.tmp" "$conf"

      - name: create .env.local file for Next.js
        run: |
          echo "NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" >> .env.local
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env.local
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> .env.local
          echo "SENTRY_ORG=readest" >> .env.local
          echo "SENTRY_PROJECT=readest" >> .env.local
          cp .env.local apps/readest-app/.env.local

      - name: build and upload Android apk
        if: matrix.config.release == 'android'
        timeout-minutes: 120
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          cd apps/readest-app/
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout .

          pushd src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

          popd
          version=${{ needs.get-release.outputs.release_version }}
          apk=Readest_${version}_${{ matrix.config.arch }}.apk
          pnpm tauri android build ${{ matrix.config.android_args }}
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk $apk

          # Sentry symbolicates Rust panics from these: the APK ships the
          # library stripped (see gen/android/app/build.gradle.kts), while
          # `target/` keeps the unstripped copy. Crash reporting must never
          # fail a build, and forks have no token.
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            pnpm exec sentry-cli debug-files upload --org readest --project readest \
              ../../target/*/release/libreadestlib.so || echo "::warning::Sentry debug file upload failed"
          fi

          echo "Uploading $apk to GitHub release"
          ../../.github/scripts/retry.sh gh release upload ${{ needs.get-release.outputs.release_tag }} $apk --clobber
          echo "Uploading signature to GitHub release"
          pnpm tauri signer sign $apk
          ../../.github/scripts/retry.sh gh release upload ${{ needs.get-release.outputs.release_tag }} $apk.sig --clobber

      - name: attest Android apk
        if: matrix.config.release == 'android'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: apps/readest-app/Readest_${{ needs.get-release.outputs.release_version }}_${{ matrix.config.arch }}.apk

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        id: tauri
        if: matrix.config.release != 'android'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_CEF_CARGO: '1'
          # quick-sharun would otherwise run the app under Xvfb to find dlopen'ed
          # libraries and hung CI (#4906). The CLI now runs it with bash and
          # streamed output, which fixes that; lifting this is its own change.
          STRACE_MODE: '0'
          # linuxdeploy's strip step fails on modern ELF relocation sections.
          NO_STRIP: ${{ matrix.config.release == 'linux' && 'true' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NODE_OPTIONS: '--max-old-space-size=8192'
        with:
          projectPath: apps/readest-app
          # `pnpm tauri` (apps/readest-app/scripts/tauri.mjs) runs the npm
          # @tauri-apps/cli, except on Linux, which ships on the CEF runtime:
          # there it runs the tauri CLI from upstream's feat/cef branch, which
          # bundles CEF into the deb, rpm and (sharun) AppImage.
          tauriScript: pnpm tauri
          releaseId: ${{ needs.get-release.outputs.release_id }}
          releaseBody: ${{ needs.get-release.outputs.release_note }}
          args: ${{ matrix.config.release == 'linux' && format('--verbose {0}', matrix.config.args || '') || matrix.config.args || '' }}
          retryAttempts: 2

      - name: build and upload Arch package
        if: matrix.config.release == 'linux' && matrix.config.arch == 'x86_64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ needs.get-release.outputs.release_version }}
          PKG_NAME: gratis-readest
          PKG_DESCRIPTION: 'Gratis Readest ebook reader'
          RELEASE_TAG: ${{ needs.get-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          mapfile -t debs < <(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print)
          [ "${#debs[@]}" -eq 1 ] || { echo '::error::expected one Debian package'; exit 1; }
          work=$(mktemp -d "$RUNNER_TEMP/arch-package.XXXXXX")
          cp .github/scripts/PKGBUILD "$work/PKGBUILD"
          cp "${debs[0]}" "$work/readest.deb"
          deb_sha=$(sha256sum "$work/readest.deb" | cut -d' ' -f1)
          echo "Debian source SHA-256: $deb_sha"
          docker run --rm \
            -v "$work:/work" -w /work \
            -e PACKAGE_VERSION -e PKG_NAME -e PKG_DESCRIPTION -e GITHUB_RUN_NUMBER -e GITHUB_RUN_ATTEMPT -e DEB_SHA256="$deb_sha" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            archlinux@sha256:bddb91b7a73f31ed6be307fc8ec75e5dd59ff8ccf6c5a1bbb8205f14702c6b4a \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed base-devel
              getent group "$HOST_GID" >/dev/null || groupadd -g "$HOST_GID" builder
              useradd -m -u "$HOST_UID" -g "$HOST_GID" builder
              runuser -u builder -- makepkg --nodeps --noconfirm
              mapfile -t packages < <(find /work -maxdepth 1 -name "*.pkg.tar.zst" -type f)
              [ "${#packages[@]}" -eq 1 ]
              pacman -U --noconfirm "${packages[0]}"
              pacman -Qi gratis-readest
              cef=$(find /usr -name libcef.so -type f -print -quit)
              [ -n "$cef" ]
              ldd "$cef" | tee /tmp/cef-ldd
              ! grep -q "not found" /tmp/cef-ldd
            '
          mapfile -t packages < <(find "$work" -maxdepth 1 -name '*.pkg.tar.zst' -type f)
          [ "${#packages[@]}" -eq 1 ] || { echo '::error::expected one Arch package'; exit 1; }
          cp "${packages[0]}" "$GITHUB_WORKSPACE/"
          gh release upload "$RELEASE_TAG" "$GITHUB_WORKSPACE/$(basename "${packages[0]}")" --clobber

      - name: attest Arch package
        if: matrix.config.release == 'linux' && matrix.config.arch == 'x86_64'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: gratis-readest-*.pkg.tar.zst

      # quick-sharun skips what it cannot find without failing; catch that
      # before it ships.
      - name: verify the AppImage bundle contents (linux only)
        if: matrix.config.release == 'linux'
        run: |
          set -euo pipefail
          appimage_dir=target/release/bundle/appimage
          mapfile -t app_dirs < <(find "$appimage_dir" -mindepth 1 -maxdepth 1 -type d -name '*.AppDir' -print)
          if [ "${#app_dirs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one AppImage AppDir in $appimage_dir"
            printf '%s\n' "${app_dirs[@]}"
            exit 1
          fi
          lib="${app_dirs[0]}/lib"
          for so in libsoftokn3.so libfreeblpriv3.so libnssckbi.so libsqlite3.so.0 \
                    libpulse.so.0 libspeechd.so.2 libxkbcommon-x11.so.0; do
            [ -e "$lib/$so" ] || { echo "::error::$so is missing from the AppImage bundle"; exit 1; }
          done
          # libpulse finds its private half through a host RUNPATH; lib.path
          # has to cover the bundled copy for it to win.
          ls "$lib"/pulseaudio/libpulsecommon-*.so > /dev/null 2>&1 \
            || { echo "::error::libpulsecommon is missing from the AppImage bundle"; exit 1; }
          grep -qx '+/pulseaudio' "$lib/lib.path" \
            || { echo "::error::lib.path does not cover lib/pulseaudio, so libpulse cannot load"; exit 1; }
          # Without this hook every new AppImage asks for a root password.
          [ -e "${lib%/lib}/bin/00-no-userns-prompt.hook" ] \
            || { echo "::error::the no-userns-prompt hook is missing from the AppImage bundle"; exit 1; }

      # Attest desktop bundles produced by the Tauri build.
      - name: attest desktop bundles
        if: matrix.config.release != 'android' && steps.tauri.outputs.artifactPaths != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ join(fromJSON(steps.tauri.outputs.artifactPaths), fromJSON('"\n"')) }}

      - name: build and upload portable binaries (Windows only)
        if: matrix.config.os == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          echo "Building Portable Binaries"
          pushd apps/readest-app/
          echo "NEXT_PUBLIC_PORTABLE_APP=true" >> .env.local
          pnpm tauri build ${{ matrix.config.args }}

          popd
          echo "Uploading Portable Binaries"
          arch=${{ matrix.config.arch }}
          version=${{ needs.get-release.outputs.release_version }}

          if [ "$arch" = "x86_64" ]; then
            bin_file="Readest_${version}_x64-portable.exe"
          elif [ "$arch" = "aarch64" ]; then
            bin_file="Readest_${version}_arm64-portable.exe"
          else
            echo "Unknown architecture: $arch"
            exit 1
          fi

          exe_file=$(find "target/${{ matrix.config.rust_target }}/release" -maxdepth 1 -type f -iname '*.exe' -print -quit)
          [ -n "$exe_file" ] || { echo "::error::portable executable is missing"; exit 1; }
          # Browsers on Windows won't download zip files that contain exe files
          # so upload the exe files instead. This is totally stupid.
          # powershell.exe -Command "Compress-Archive -Path $exe_file -DestinationPath $bin_file -Force"
          cp "$exe_file" "$bin_file"

          echo "Uploading $bin_file to GitHub release"
          .github/scripts/retry.sh gh release upload ${{ needs.get-release.outputs.release_tag }} $bin_file --clobber

          echo "Signing portable binary"
          pushd apps/readest-app/
          pnpm tauri signer sign "../../$bin_file"
          popd
          echo "Uploading signature to GitHub release"
          .github/scripts/retry.sh gh release upload ${{ needs.get-release.outputs.release_tag }} $bin_file.sig --clobber

      # The portable rebuild above is not produced by tauri-action, so it is not
      # covered by the "attest desktop bundles" step; attest it here. Exactly one
      # portable exe is staged at the workspace root per Windows leg.
      - name: attest Windows portable binary
        if: matrix.config.os == 'windows-latest'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: Readest_*-portable.exe

  # Merge mobile, portable Windows, and Linux AppImage updater entries once all builds finish.
  update-android-latest-json:
    needs: [get-release, build-tauri]
    if: needs.get-release.outputs.release_ready == 'true' && needs.build-tauri.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.get-release.outputs.source_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: assemble Android and portable updater entries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.get-release.outputs.release_tag }}
          RELEASE_ID: ${{ needs.get-release.outputs.release_id }}
          RELEASE_VERSION: ${{ needs.get-release.outputs.release_version }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --pattern latest.json --clobber
          jq -e --arg version "$RELEASE_VERSION" '.version == $version and (.platforms | type == "object")' latest.json >/dev/null
          gh release download "$RELEASE_TAG" --pattern '*.sig' --clobber

          for arch in arm64 armv7 legacy; do
            apk="Readest_${RELEASE_VERSION}_${arch}.apk"
            sig=$(cat "${apk}.sig")
            jq --arg url "https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/${apk}" \
              --arg sig "$sig" --arg key "android-${arch}" \
              '.platforms[$key] = {signature:$sig,url:$url}' latest.json > latest.tmp
            mv latest.tmp latest.json
          done
          jq '.platforms["android-universal"] = .platforms["android-armv7"]' latest.json > latest.tmp
          mv latest.tmp latest.json

          for arch in x64 arm64; do
            if [ "$arch" = x64 ]; then key=windows-x86_64-portable; else key=windows-aarch64-portable; fi
            binary="Readest_${RELEASE_VERSION}_${arch}-portable.exe"
            sig=$(cat "${binary}.sig")
            jq --arg url "https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/${binary}" \
              --arg sig "$sig" --arg key "$key" \
              '.platforms[$key] = {signature:$sig,url:$url}' latest.json > latest.tmp
            mv latest.tmp latest.json
          done

          mapfile -t assets < <(gh api --paginate "repos/${GH_REPO}/releases/${RELEASE_ID}/assets" --jq '.[].name')
          for arch in amd64 aarch64; do
            suffix="_${arch}.AppImage"
            matches=()
            for asset in "${assets[@]}"; do
              if [[ "$asset" == *"$suffix" ]]; then matches+=("$asset"); fi
            done
            [ "${#matches[@]}" -eq 1 ] || { echo "::error::expected one ${arch} AppImage"; exit 1; }
            name=${matches[0]}
            if [ "$arch" = amd64 ]; then key=linux-x86_64-appimage; else key=linux-aarch64-appimage; fi
            jq --arg url "https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/${name}" --arg key "$key" \
              '.platforms[$key] = {url:$url}' latest.json > latest.tmp
            mv latest.tmp latest.json
          done

          gh release upload "$RELEASE_TAG" latest.json --clobber
  finalize-release:
    needs:
      - get-release
      - build-koreader-plugin
      - build-calibre-plugin
      - build-crosspoint-plugin
      - build-browser-extension
      - build-tauri
      - update-android-latest-json
    if: needs.get-release.outputs.release_ready == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.get-release.outputs.source_sha }}
          persist-credentials: false

      - name: upload release notes asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.get-release.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" apps/readest-app/release-notes.json --clobber

      - name: verify draft assets and updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.get-release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.get-release.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.get-release.outputs.release_version }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --pattern latest.json --clobber
          jq -e --arg version "$RELEASE_VERSION" '
            .version == $version and
            (.platforms | type == "object") and
            (.platforms as $p |
              all(["android-arm64", "android-armv7", "android-legacy", "android-universal", "windows-x86_64", "windows-aarch64", "windows-x86_64-portable", "windows-aarch64-portable", "linux-x86_64-appimage", "linux-aarch64-appimage"][]; . as $key | ($p[$key].url | type == "string")) and
              all(["android-arm64", "android-armv7", "android-legacy", "android-universal", "windows-x86_64", "windows-aarch64", "windows-x86_64-portable", "windows-aarch64-portable"][]; . as $key | ($p[$key].signature | type == "string")))
          ' latest.json >/dev/null

          mapfile -t assets < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[].name')
          require_asset() {
            printf '%s\n' "${assets[@]}" | grep -Fxq "$1" || { echo "::error::missing release asset: $1"; exit 1; }
          }
          require_asset "release-notes.json"
          for arch in arm64 armv7 legacy; do
            require_asset "Readest_${RELEASE_VERSION}_${arch}.apk"
            require_asset "Readest_${RELEASE_VERSION}_${arch}.apk.sig"
          done
          for arch in x64 arm64; do
            require_asset "Gratis Readest_${RELEASE_VERSION}_${arch}-setup.exe"
            require_asset "Gratis Readest_${RELEASE_VERSION}_${arch}-setup.exe.sig"
            require_asset "Readest_${RELEASE_VERSION}_${arch}-portable.exe"
            require_asset "Readest_${RELEASE_VERSION}_${arch}-portable.exe.sig"
          done
          mapfile -t arch_packages < <(printf '%s\n' "${assets[@]}" | grep -E "^gratis-readest-${RELEASE_VERSION}-.*-x86_64\\.pkg\\.tar\\.zst$" || true)
          [ "${#arch_packages[@]}" -eq 1 ] || { echo '::error::expected exactly one stable Arch package'; exit 1; }
          appimages=$(printf '%s\n' "${assets[@]}" | grep -Ec '\.AppImage$' || true)
          debs=$(printf '%s\n' "${assets[@]}" | grep -Ec '\.deb$' || true)
          rpms=$(printf '%s\n' "${assets[@]}" | grep -Ec '\.rpm$' || true)
          [ "$appimages" -ge 2 ] && [ "$debs" -ge 2 ] && [ "$rpms" -ge 2 ] \
            || { echo '::error::Linux x86_64/aarch64 bundles are incomplete'; exit 1; }

      - name: publish validated release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.get-release.outputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest

  upload-to-r2:
    needs: [get-release, build-tauri, update-android-latest-json]
    if: github.repository == 'readest/readest'
    permissions:
      contents: read
    uses: ./.github/workflows/upload-to-r2.yml
    with:
      tag: ${{ needs.get-release.outputs.release_tag }}
    secrets: inherit
