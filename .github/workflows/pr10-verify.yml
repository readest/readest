name: PR10 verify

on:
  push:
    branches:
      - fix/lan-sync-pairing-and-image-drag

permissions:
  contents: read

concurrency:
  group: pr10-verify
  cancel-in-progress: true

jobs:
  frontend:
    name: TypeScript and ImageViewer tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: prepare frontend vendors
        run: pnpm --filter @readest/readest-app setup-vendors
      - name: TypeScript
        run: pnpm --filter @readest/readest-app exec tsc --noEmit
      - name: ImageViewer regression tests
        run: pnpm --filter @readest/readest-app exec vitest run src/__tests__/components/ImageViewer.test.tsx --maxWorkers=2

  rust:
    name: Rust LAN sync compile and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: pr10-lan-sync
      - name: cargo check
        run: cargo check -p Readest
      - name: Rust LAN sync unit tests
        run: cargo test -p Readest --lib lan_sync
