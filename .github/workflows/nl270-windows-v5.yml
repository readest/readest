name: NL-270 Windows v5

on:
  push:
    branches:
      - agent/ginit-codex/0163cd514799

jobs:
  windows_x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @readest/readest-app setup-vendors
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: nl-270-windows-x64-cargo-v5
      - name: create Tauri environment
        shell: bash
        run: |
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" > .env.local
          cp .env.local apps/readest-app/.env.local
      - name: build Windows x64 upgrade installer
        shell: bash
        timeout-minutes: 45
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          READEST_FOUNDATION_SPIKE: '1'
        run: |
          cd apps/readest-app
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --config '{"productName":"Readest NL-270","identifier":"com.readest.nl270","version":"0.12.13","bundle":{"createUpdaterArtifacts":false}}'
      - name: download v4 upgrade baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35755697410 --repo surenny/readest --name Readest-NL-270-Windows-x64-v4 --dir old-installer
      - name: verify in-place upgrade and installer
        shell: pwsh
        run: |
          $oldInstaller = Get-ChildItem old-installer/*-setup.exe | Select-Object -First 1
          $newInstaller = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $oldInstaller -or -not $newInstaller) { throw "Windows installer was not generated" }
          $oldProcess = Start-Process $oldInstaller.FullName -ArgumentList "/S" -Wait -PassThru
          if ($oldProcess.ExitCode -ne 0) { throw "v4 silent install failed: $($oldProcess.ExitCode)" }
          $dataDir = Join-Path $env:APPDATA "com.readest.nl270"
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $sentinel = Join-Path $dataDir "nl270-upgrade-sentinel.txt"
          Set-Content $sentinel "preserve-me"
          $newProcess = Start-Process $newInstaller.FullName -ArgumentList "/S" -Wait -PassThru
          if ($newProcess.ExitCode -ne 0) { throw "0.12.13 silent upgrade failed: $($newProcess.ExitCode)" }
          if ((Get-Content $sentinel) -ne "preserve-me") { throw "App data was not preserved" }
          $uninstallRoots = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall"
          )
          $entries = $uninstallRoots | Where-Object { Test-Path $_ } | ForEach-Object {
            Get-ChildItem $_ | Get-ItemProperty
          } | Where-Object { $_.DisplayName -eq "Readest NL-270" }
          if (@($entries).Count -ne 1) { throw "Expected one Readest NL-270 uninstall entry, got $(@($entries).Count)" }
          if ($entries.DisplayVersion -ne "0.12.13") { throw "Installed version is $($entries.DisplayVersion)" }
          $signature = Get-AuthenticodeSignature $newInstaller.FullName
          $hash = Get-FileHash $newInstaller.FullName -Algorithm SHA256
          Write-Host "Installer: $($newInstaller.Name)"
          Write-Host "Size: $($newInstaller.Length) bytes"
          Write-Host "SHA256: $($hash.Hash)"
          Write-Host "Authenticode: $($signature.Status)"
          Write-Host "Upgrade: v4 -> 0.12.13, data preserved, one uninstall entry"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Readest-NL-270-Windows-x64-v5
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          compression-level: 0
