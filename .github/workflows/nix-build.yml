name: Build with Nix

on:
  push:
    branches: [main]
concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
    - uses: cachix/cachix-action@f495f3ffa2f3810a92e5cc0abc2c5d6a2a07ec82
      with:
        name: readest
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: build with nix
      run: nix build -L # --extra-substituters is provided by the cachix action; does not need to be specified  
