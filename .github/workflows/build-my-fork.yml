# Build workflow for fork builds
# Mirrors the upstream release.yml structure but without requiring
# code signing keys, Sentry DSN, PostHog, Supabase, or any secrets.
# Trigger: push to main, PRs to main, or manual dispatch.

name: Build Fork

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tauri:
    name: ${{ matrix.config.release }} ${{ matrix.config.arch || '' }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-latest
            release: android
            rust_target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          - os: ubuntu-22.04
            release: linux
            arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
          - os: macos-latest
            release: macos
            arch: aarch64
            rust_target: x86_64-apple-darwin,aarch64-apple-darwin
            args: '--target universal-apple-darwin'
          - os: windows-latest
            release: windows
            arch: x86_64
            rust_target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc --bundles nsis'

    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Setup Java (Android only)
        if: matrix.config.release == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK (Android only)
        if: matrix.config.release == 'android'
        uses: android-actions/setup-android@v4

      - name: Install NDK (Android only)
        if: matrix.config.release == 'android'
        run: sdkmanager "ndk;28.2.13676358"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Copy vendor dists to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.config.os }}-${{ matrix.config.release }}-${{ matrix.config.arch }}-cargo

      - name: Install system dependencies (Linux desktop only)
        if: matrix.config.release == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libfontconfig-dev libgtk-3-dev \
            libwebkit2gtk-4.1 libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev \
            gir1.2-javascriptcoregtk-4.1 gir1.2-webkit2-4.1 \
            libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Build Android APKs
        if: matrix.config.release == 'android'
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          cd apps/readest-app
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          pnpm tauri android build 2>&1 || echo "(Android build failed — see logs)"
          mkdir -p dist/android
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
             dist/android/readest-universal.apk 2>/dev/null || true
          pnpm tauri android build -t aarch64 2>&1 || echo "(Android arm64 build failed)"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
             dist/android/readest-arm64.apk 2>/dev/null || true

      - name: Build Tauri desktop app
        if: matrix.config.release != 'android'
        working-directory: apps/readest-app
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm tauri build ${{ matrix.config.args }}

      - name: Upload Android APKs
        if: matrix.config.release == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: readest-${{ matrix.config.release }}
          path: apps/readest-app/dist/android/
          if-no-files-found: warn

      - name: Upload desktop bundles
        if: matrix.config.release != 'android'
        uses: actions/upload-artifact@v4
        with:
          name: readest-${{ matrix.config.release }}-${{ matrix.config.arch }}
          path: apps/readest-app/src-tauri/target/release/bundle/
          if-no-files-found: warn

  # Separate job for the web static export (no native deps)
  build-web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @readest/readest-app setup-vendors
      - name: Build web (static export)
        working-directory: apps/readest-app
        env:
          NEXT_PUBLIC_APP_PLATFORM: tauri
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm build-web
      - uses: actions/upload-artifact@v4
        with:
          name: readest-web
          path: apps/readest-app/out/
          if-no-files-found: warn
