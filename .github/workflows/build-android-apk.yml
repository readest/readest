name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/readest-app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Prepare bundled vendor assets
        working-directory: .
        run: pnpm --filter @readest/readest-app setup-vendors
      - name: Build optimized arm64 release APK
        id: release
        continue-on-error: true
        run: |
          # Tauri's frontend must be bundled for the native platform, not web.
          echo 'NEXT_PUBLIC_APP_PLATFORM=tauri' > .env.local
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout -- src-tauri/gen/android
          keytool -genkeypair -storetype JKS -keystore "$RUNNER_TEMP/test-release.jks" \
            -storepass android -alias androiddebugkey -keypass android -keyalg RSA \
            -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          cat > src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=androiddebugkey
          password=android
          storeFile=$RUNNER_TEMP/test-release.jks
          EOF
          pnpm tauri android build -t aarch64
      - name: Build arm64 debug APK if release packaging fails
        if: steps.release.outcome == 'failure'
        run: |
          echo '::warning::Release packaging failed; publishing an arm64 debug fallback for testing.'
          pnpm tauri android build --debug -t aarch64
      - name: Stage APK
        run: |
          if [ "${{ steps.release.outcome }}" = 'success' ]; then
            APK=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          else
            APK=src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          fi
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/readest-android-latest.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: readest-android-apk
          path: readest-android-latest.apk
          compression-level: 0
          retention-days: 30
      - name: Publish rolling latest APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Android Build
          prerelease: true
          files: readest-android-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
