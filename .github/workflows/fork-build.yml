# Fork-local build: Windows NSIS installer + Android universal APK.
# Stripped-down cousin of nightly.yml: same build steps, no R2/attestation/
# signing secrets — the updater key and Android keystore are generated
# per-run inside the workflow, so the APK is sideload-ready and the installer
# builds even with an empty secrets list.
#
# Artifacts (per run): Readest_<version>_x64-setup.exe (+ .sig) and
# Readest_<version>_universal.apk.
name: Fork Build (Windows + Android)

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build Windows installer'
        type: boolean
        default: true
      build_android:
        description: 'Build Android universal APK'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: install Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: fork-windows-x86_64-cargo

      - name: create .env.local for Next.js
        shell: bash
        run: |
          # Fork build: cloud keys stay empty on purpose; the app degrades to
          # "not signed in" instead of failing. Only the platform flag matters.
          cat > .env.local <<EOF
          NEXT_PUBLIC_APP_PLATFORM=tauri
          NEXT_PUBLIC_POSTHOG_KEY=
          NEXT_PUBLIC_SUPABASE_URL=
          NEXT_PUBLIC_SUPABASE_ANON_KEY=
          SENTRY_DSN=
          EOF
          cp .env.local apps/readest-app/.env.local

      - name: generate updater signing key
        id: updater-key
        shell: bash
        run: |
          # tauri.conf.json sets createUpdaterArtifacts: true, so the bundler
          # refuses to run without a signing key. Generate a throwaway key per
          # run — artifacts are for sideloading, not for the updater feed.
          pnpm tauri signer generate -w "$RUNNER_TEMP/updater.key" --password "" --force
          echo "private_key=$(cat "$RUNNER_TEMP/updater.key")" >> "$GITHUB_OUTPUT"
          echo "password=" >> "$GITHUB_OUTPUT"

      - name: build Windows installer (NSIS)
        shell: bash
        timeout-minutes: 45
        env:
          TAURI_PRIVATE_KEY: ${{ steps.updater-key.outputs.private_key }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ steps.updater-key.outputs.password }}
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          version=$(node -p "require('./apps/readest-app/package.json').version")
          echo "version=$version" >> "$GITHUB_ENV"
          cd apps/readest-app
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: collect artifacts
        shell: bash
        run: |
          version="${{ env.version }}"
          mkdir -p fork-out
          src="target/x86_64-pc-windows-msvc/release/bundle/nsis/Readest_${version}_x64-setup.exe"
          cp "$src" fork-out/
          cp "${src}.sig" fork-out/ 2>/dev/null || true

      - name: upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Readest_${{ env.version }}_windows_x64
          path: fork-out/
          if-no-files-found: error

  android:
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: setup Java 17 (Android build)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: install Rust stable (Android targets)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: fork-android-cargo

      - name: create .env.local for Next.js
        run: |
          cat > .env.local <<EOF
          NEXT_PUBLIC_APP_PLATFORM=tauri
          NEXT_PUBLIC_POSTHOG_KEY=
          NEXT_PUBLIC_SUPABASE_URL=
          NEXT_PUBLIC_SUPABASE_ANON_KEY=
          SENTRY_DSN=
          EOF
          cp .env.local apps/readest-app/.env.local

      # gen/android is tracked in this repo and matches the pinned tauri CLI,
      # so unlike nightly.yml we do NOT regenerate it — just drop in a keystore
      # and build. Swap in your own keystore via secrets later if you want a
      # stable signing identity across runs.
      - name: write signing keystore
        run: |
          cd apps/readest-app/src-tauri/gen/android
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/keystore.jks" \
            -alias readest-fork \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass readest-fork-store -keypass readest-fork-key \
            -dname "CN=Readest Fork, OU=Fork, O=Fork, C=CN"
          cat > keystore.properties <<EOF
          keyAlias=readest-fork
          password=readest-fork-store
          storeFile=$RUNNER_TEMP/keystore.jks
          EOF

      - name: build Android universal APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          version=$(node -p "require('./apps/readest-app/package.json').version")
          echo "version=$version" >> "$GITHUB_ENV"
          cd apps/readest-app
          pnpm tauri android build

      - name: collect artifacts
        run: |
          version="${{ env.version }}"
          mkdir -p fork-out
          cp "apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk" \
             "fork-out/Readest_${version}_universal.apk"

      - name: upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Readest_${{ env.version }}_android_universal
          path: fork-out/
          if-no-files-found: error
